---
- name: Check if transparent_hugepage is disabled in the boot command
  ansible.builtin.lineinfile:
    backup: true
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX=".*transparent_hugepage=never'
    state: absent
  check_mode: true
  register: grub_cmdline_check
  changed_when: false
  become: true
  when: redis_transparent_hugepage_disabled

- name: Ensure transparent_hugepage is set to never if missing
  ansible.builtin.lineinfile:
    backrefs: true
    path: /etc/default/grub
    regexp: "^(GRUB_CMDLINE_LINUX=\".*)\"$"
    line: '\1 transparent_hugepage=never"'
  become: true
  notify:
    - Update Grub
  when: redis_transparent_hugepage_disabled and grub_cmdline_check.found == 0

- name: Ensure VM Overcommit Memory is set to 1
  ansible.posix.sysctl:
    name: vm.overcommit_memory
    value: "1"
    state: present
    reload: true
  become: true
  when: redis_vm_overcommit_memory_enabled

- name: Ensure Redis paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ redis_uid }}"
    group: "{{ redis_gid }}"
  with_items:
    - "{{ redis_base_path }}"
    - "{{ redis_data_path }}"

- name: Ensure Redis support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ redis_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ redis_uid }}"
    group: "{{ redis_gid }}"
  with_items:
    - env
    - "redis.conf"
  register: redis_support_files_result

- name: Ensure Redis container image is pulled via community.docker.docker_image
  when: devture_systemd_docker_base_container_image_pull_method == 'ansible-module'
  community.docker.docker_image:
    name: "{{ redis_container_image }}"
    source: "{{ 'pull' if ansible_version.major > 2 or ansible_version.minor > 7 else omit }}"
    force_source: "{{ redis_container_image_force_pull if ansible_version.major > 2 or ansible_version.minor >= 8 else omit }}"
    force: "{{ omit if ansible_version.major > 2 or ansible_version.minor >= 8 else redis_container_image_force_pull }}"
  register: redis_container_image_pull_result
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: redis_container_image_pull_result is not failed

- name: Ensure Redis container image is pulled via ansible.builtin.command
  when: devture_systemd_docker_base_container_image_pull_method == 'command'
  ansible.builtin.command:
    cmd: "{{ devture_systemd_docker_base_host_command_docker }} pull {{ redis_container_image }}"
  register: redis_container_image_pull_result
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: redis_container_image_pull_result is not failed
  changed_when: "'Downloaded newer image' in redis_container_image_pull_result.stdout"

- name: Ensure Redis container network is created via community.docker.docker_network
  when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ redis_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
  register: redis_network_creation_result

- name: Ensure Redis container network is created via ansible.builtin.command
  when: devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ redis_container_network }}
  register: redis_network_creation_result
  changed_when: redis_network_creation_result.rc == 0
  failed_when: redis_network_creation_result.rc != 0 and 'already exists' not in redis_network_creation_result.stderr

- name: Ensure Redis systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/redis.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ redis_identifier }}.service"
    mode: "0644"
  register: redis_systemd_service_result

- name: Determine whether Redis needs a restart
  ansible.builtin.set_fact:
    redis_restart_necessary: >-
      {{
        redis_support_files_result.changed | default(false)
        or redis_systemd_service_result.changed | default(false)
        or redis_container_image_pull_result.changed | default(false)
      }}
