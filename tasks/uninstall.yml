---
- name: Check existence of Redis service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ redis_identifier }}.service"
  register: redis_service_stat

- name: Uninstall Redis systemd services and files
  when: redis_service_stat.stat.exists | bool
  block:
    - name: Ensure Redis systemd service is stopped
      ansible.builtin.systemd:
        name: "{{ redis_identifier }}"
        state: stopped
        enabled: false
        daemon_reload: true

    - name: Ensure Redis systemd service does not exist
      ansible.builtin.file:
        path: "{{ devture_systemd_docker_base_systemd_path }}/{{ redis_identifier }}.service"
        state: absent

    - name: Ensure Redis support file does not exist
      ansible.builtin.file:
        path: "{{ redis_base_path }}/{{ item }}"
        state: absent
      with_items:
        - redis.conf

    - name: Ensure Redis local data path does not exist if empty
      ansible.builtin.command:
        cmd: "rmdir {{ redis_data_path }}"
      register: redis_data_path_deletion_result
      changed_when: redis_data_path_deletion_result.rc == 0

    - name: Ensure Redis base path does not exist if empty
      ansible.builtin.command:
        cmd: "rmdir {{ redis_base_path }}"
      register: redis_base_path_deletion_result
      changed_when: redis_base_path_deletion_result.rc == 0

    - name: Ensure Redis container network does not exist via community.docker.docker_network
      when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
      community.docker.docker_network:
        name: "{{ redis_container_network }}"
        state: absent

    - name: Ensure Redis container network does not exist via ansible.builtin.command
      when: devture_systemd_docker_base_container_network_creation_method == 'command'
      ansible.builtin.command:
        cmd: >-
          {{ devture_systemd_docker_base_host_command_docker }} network rm
          {{ redis_container_network }}
      register: network_deletion_result
      changed_when: redis_container_network in network_deletion_result.stdout

- name: Check existence of Redis local data path
  ansible.builtin.stat:
    path: "{{ redis_data_path }}"
  register: redis_data_path_stat

# We just want to notify the user. Deleting data is too destructive.
- name: Notify if Redis local data remains
  when: redis_data_path_stat.stat.exists | bool
  ansible.builtin.set_fact:
    devture_playbook_runtime_messages_list: |
      {{
        devture_playbook_runtime_messages_list | default([])
        +
        [
          "Note: You are not using a local Redis instance, but some old data remains from before in `" + redis_data_path + "`. Feel free to delete it."
        ]
      }}
