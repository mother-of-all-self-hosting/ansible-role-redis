---
# handlers file for Redis

- name: Update Grub
  ansible.builtin.command: update-grub
  become: true
  notify: Reboot
  register: reboot
  changed_when: "'Generating' in reboot.stdout"

- name: Reboot
  ansible.builtin.reboot:
    msg: "Reboot initiated by Ansible Handler"
    connect_timeout: 5
    reboot_timeout: 300
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: uptime
  become: true
  when: redis_reboot_enabled
