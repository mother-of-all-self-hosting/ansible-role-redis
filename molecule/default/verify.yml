---
- name: Verify Redis
  hosts: all
  become: true
  gather_facts: false

  vars:
    redis_verify_units:
      - redis.service

  tasks:
    - name: Verify that Redis works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: redis_defaults

        - name: Wait for the Redis systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: redis_services
          until: redis_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ redis_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Redis systemd services are active
          ansible.builtin.assert:
            that: redis_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(redis_verify_units | zip(redis_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Redis systemd services log for debugging
          when: redis_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ redis_verify_units }}"

        # A systemd unit reaching "active" only means that `docker start` has not
        # exited yet. PING is the cheapest answer the server itself can give, so it
        # is the first thing here that proves a usable Redis rather than merely a
        # running process.
        #
        # Unlike the sibling Valkey role, this role does not ask for a UNIX socket
        # listener in redis.conf, so TCP is the only path its consumers have and
        # the only one there is to probe.
        #
        # community.docker is deliberately avoided throughout this playbook: the
        # linting environment in CI has no collections installed.
        - name: Wait for Redis to answer PING over TCP (up to 120s)
          ansible.builtin.command:
            cmd: >-
              docker exec {{ redis_defaults.redis_identifier }}
              redis-cli -a {{ redis_connection_password }} --no-auth-warning PING
          register: redis_ping_tcp
          changed_when: false
          until: redis_ping_tcp.rc == 0 and 'PONG' in redis_ping_tcp.stdout
          retries: 24
          delay: 5

        - name: Assert Redis answers PING over TCP
          ansible.builtin.assert:
            that: "'PONG' in redis_ping_tcp.stdout"
            fail_msg: "Redis did not answer PING over TCP: {{ redis_ping_tcp.stdout | default('no output') }}"
            success_msg: "Redis answers PING over TCP"

        # This scenario sets a connection password, so an unauthenticated client
        # must be turned away. Without this probe, the `requirepass` branch of
        # redis.conf.j2 could stop being rendered and everything else here would
        # still pass.
        #
        # redis-cli exits 0 even when the server refuses the command, and prints
        # the refusal on stdout rather than stderr, so the return code proves
        # nothing here and the answer itself has to be inspected.
        - name: Ping Redis without authenticating
          ansible.builtin.command:
            cmd: "docker exec {{ redis_defaults.redis_identifier }} redis-cli PING"
          register: redis_ping_unauthenticated
          changed_when: false
          failed_when: false

        - name: Assert Redis rejects unauthenticated clients
          ansible.builtin.assert:
            that:
              - "'NOAUTH' in (redis_ping_unauthenticated.stdout + redis_ping_unauthenticated.stderr)"
              - "'PONG' not in redis_ping_unauthenticated.stdout"
            fail_msg: >-
              Redis did not reject an unauthenticated client:
              {{ redis_ping_unauthenticated.stdout | default('no output') }}
            success_msg: "Redis rejects unauthenticated clients"

        # Turning away a client that sends no password only proves that some
        # password is set. This proves that the password the server accepts is the
        # one this scenario asked for, which is what ties the rendered redis.conf
        # to the running process rather than just to disk.
        - name: Ping Redis with the wrong password
          ansible.builtin.command:
            cmd: >-
              docker exec {{ redis_defaults.redis_identifier }}
              redis-cli -a not-the-configured-password --no-auth-warning PING
          register: redis_ping_wrong_password
          changed_when: false
          failed_when: false

        - name: Assert Redis rejects the wrong password
          ansible.builtin.assert:
            that:
              - "'WRONGPASS' in (redis_ping_wrong_password.stdout + redis_ping_wrong_password.stderr)"
              - "'PONG' not in redis_ping_wrong_password.stdout"
            fail_msg: >-
              Redis did not reject a client using the wrong password:
              {{ redis_ping_wrong_password.stdout | default('no output') }}
            success_msg: "Redis rejects the wrong password"

        # A write and a read back through a separate connection, which covers the
        # whole path (client -> server -> keyspace) in both directions rather than
        # just the fact that the server accepts connections.
        - name: Write a key to Redis
          ansible.builtin.command:
            cmd: >-
              docker exec {{ redis_defaults.redis_identifier }}
              redis-cli -a {{ redis_connection_password }} --no-auth-warning
              SET molecule-key molecule-value
          register: redis_set
          changed_when: true

        - name: Read the key back from Redis
          ansible.builtin.command:
            cmd: >-
              docker exec {{ redis_defaults.redis_identifier }}
              redis-cli -a {{ redis_connection_password }} --no-auth-warning
              GET molecule-key
          register: redis_get
          changed_when: false

        - name: Assert the key was stored and read back
          ansible.builtin.assert:
            that:
              - "'OK' in redis_set.stdout"
              - "'molecule-value' in redis_get.stdout"
            fail_msg: "A SET/GET round-trip failed (SET: {{ redis_set.stdout }}, GET: {{ redis_get.stdout }})"
            success_msg: "A SET/GET round-trip works"

        # Tying the running version to `redis_version` is what makes this scenario
        # a real test of the version that Renovate bumps: a bump that produces an
        # unusable image cannot pass here.
        - name: Query the version of the running Redis
          ansible.builtin.command:
            cmd: >-
              docker exec {{ redis_defaults.redis_identifier }}
              redis-cli -a {{ redis_connection_password }} --no-auth-warning
              INFO server
          register: redis_info_server
          changed_when: false

        # INFO fields are terminated with CRLF, so the carriage return has to be
        # excluded while capturing rather than trimmed off a greedier match.
        - name: Determine the version of the running Redis
          ansible.builtin.set_fact:
            redis_reported_version: "{{ (redis_info_server.stdout | regex_search('redis_version:([^\\r\\n]+)', '\\1') | first) | trim }}"

        - name: Assert the running Redis is the version this role installs
          ansible.builtin.assert:
            that: redis_reported_version.startswith(redis_defaults.redis_version | string)
            fail_msg: "Redis reports {{ redis_reported_version | default('none') }}, expected {{ redis_defaults.redis_version }}"
            success_msg: "Redis reports {{ redis_reported_version }}"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "redis_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: redis_restarts_before
              loop: "{{ redis_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: redis_restarts_after
              loop: "{{ redis_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - redis_restarts_after.results | map(attribute='status.NRestarts') | list == redis_restarts_before.results | map(attribute='status.NRestarts') | list
                  - redis_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in redis_verify_units | zip(redis_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in redis_verify_units | zip(redis_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in redis_verify_units | zip(redis_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Redis verification summary
          ansible.builtin.debug:
            msg:
              - "Redis systemd: {% for unit, state in redis_verify_units | zip(redis_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Redis restarts: {% for unit, restarts in redis_verify_units | zip(redis_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Redis version: {{ redis_reported_version }}"
              - "Redis PING over TCP: {{ redis_ping_tcp.stdout }}"
              - "Redis SET/GET round-trip: {{ redis_get.stdout }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Redis systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=redis.service
          register: redis_service_log
          changed_when: false

        - name: Show the Redis systemd service log
          ansible.builtin.debug:
            var: redis_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Redis verification failed. The systemd service log is printed above."
