---
# Project source code URL: https://github.com/redis/redis

redis_enabled: true

redis_identifier: redis
redis_base_path: "/{{ redis_identifier }}"
redis_data_path: "{{ redis_base_path }}/data"

# renovate: datasource=docker depName=redis versioning=semver
redis_version: 8.6.0

redis_uid: ""
redis_gid: ""

redis_container_image: "{{ redis_container_image_registry_prefix }}redis:{{ redis_container_image_tag }}"
redis_container_image_tag: "{{ redis_version }}-alpine"
redis_container_image_registry_prefix: "{{ redis_container_image_registry_prefix_upstream }}"
redis_container_image_registry_prefix_upstream: "{{ redis_container_image_registry_prefix_upstream_default }}"
redis_container_image_registry_prefix_upstream_default: docker.io/
redis_container_image_force_pull: "{{ redis_container_image.endswith(':latest') }}"

# Specify how the container publishes its TCP port (as defined by `redis_container_network`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
redis_container_redis_bind_port: ""

# The base container network. It will be auto-created by this role if it doesn't exist already.
redis_container_network: "{{ redis_identifier }}"

# Control if the container network is deleted on uninstalling.
redis_container_network_deletion_enabled: true

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
redis_container_additional_networks: "{{ redis_container_additional_networks_auto + redis_container_additional_networks_custom }}"
redis_container_additional_networks_auto: []
redis_container_additional_networks_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
# Because `devture_systemd_docker_base_container_stop_grace_time_seconds` may be quite short and databases are more important to stop gracefully,
# we default to at least 30 seconds.
redis_container_stop_grace_time_seconds: "{{ [devture_systemd_docker_base_container_stop_grace_time_seconds, 30] | max }}"

# Specify the size of the container's tmpfs volume
redis_container_tmpfs_tmp_size: 128m

# A list of extra arguments to pass to the container (`docker create` command)
redis_container_extra_arguments: "{{ redis_container_extra_arguments_auto + redis_container_extra_arguments_custom }}"
redis_container_extra_arguments_auto: []
redis_container_extra_arguments_custom: []

# List of systemd services that the Redis systemd service depends on
redis_systemd_required_services_list: "{{ redis_systemd_required_services_list_default + redis_systemd_required_services_list_auto + redis_systemd_required_services_list_custom }}"
redis_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
redis_systemd_required_services_list_auto: []
redis_systemd_required_services_list_custom: []

# List of systemd services that the Redis systemd service wants
redis_systemd_wanted_services_list: "{{ redis_systemd_wanted_services_list_default + redis_systemd_wanted_services_list_auto + redis_systemd_wanted_services_list_custom }}"
redis_systemd_wanted_services_list_default: []
redis_systemd_wanted_services_list_auto: []
redis_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
# Because `devture_systemd_docker_base_container_stop_grace_time_seconds` may be quite short and databases are more important to stop gracefully,
# we default to at least 30 seconds.
redis_container_stop_grace_time_seconds: "{{ [devture_systemd_docker_base_container_stop_grace_time_seconds, 30] | max }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
redis_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
redis_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
redis_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ redis_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ redis_container_stop_grace_time_seconds }} {{ redis_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ redis_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ redis_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ redis_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ redis_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ redis_identifier }} after {{ redis_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

redis_connection_password: ""

# Transparent Huge Pages being enabled causes Redis incurs to a big latency penalty after the fork call is used in order to persist on disk
# https://redis.io/docs/latest/operate/oss_and_stack/management/optimization/latency/#latency-induced-by-transparent-huge-pages
redis_transparent_hugepage_disabled: false

# The strict memory allocation can cause Redis's background saving to fail with a fork() error
# https://redis.io/docs/latest/develop/get-started/faq/#background-saving-fails-with-a-fork-error-on-linux
redis_vm_overcommit_memory_enabled: false

# redis_transparent_hugepage_disabled requires a reboot for changes to take affect as it is making changes to the kernel
redis_reboot_enabled: false

# Specify the timezone
redis_environment_variables_tz: UTC

# Additional environment variables.
redis_environment_variables_additional_variables: ""
